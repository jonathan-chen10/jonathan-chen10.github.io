<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Jonathan Chen{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
    ></script>
    <script
      data-goatcounter="https://jonathan-chen10.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <nav class="container-fluid dark-orange py-2 px-3">
      <div style="display: flex; align-items: center; gap: 20px">
        <a href="/" style="text-decoration: none; color: inherit">
          <strong>Jonathan Chen</strong>
        </a>
        <a href="/blog/" style="text-decoration: none; color: inherit">Blog</a>
      </div>
    </nav>

    <main class="container pt-4 pb-5">
      {% block content %}{% endblock %}
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
      crossorigin="anonymous"
    ></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".math-inline").forEach(function (el) {
          katex.render(el.textContent, el, {
            throwOnError: false,
            displayMode: false,
          });
        });
        document.querySelectorAll(".math-display").forEach(function (el) {
          katex.render(el.textContent, el, {
            throwOnError: false,
            displayMode: true,
          });
        });
        document.querySelectorAll("pre code").forEach(function (el) {
          hljs.highlightElement(el);
        });
      });
    </script>
  </body>
</html>
