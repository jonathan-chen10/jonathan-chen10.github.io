{% extends "base.html" %}

{% block title %}Tags | Jonathan Chen{% endblock %}

{% block content %}
  <h1>Tags</h1>
  <hr />
  {% if tags | length  %}
    <ul class="tag-list">
      {% for tag in tags %}
        <li class="tag-item">
          <a href="/blog/tags/{{ tag.name }}/">#{{ tag.name }}</a>
          <span class="tag-count">({{ tag.count }})</span>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No tags yet.</p>
  {% endif %}
{% endblock %}
