{% extends "base.html" %}

{% block title %}Tags — Jonathan Chen{% endblock %}

{% block content %}
  <h1>Tags</h1>
  <hr />
  {% if tags %}
    <ul class="list-unstyled">
      {% for tag in tags %}
        <li class="mb-2">
          <a href="/blog/tags/{{ tag.name }}.html">#{{ tag.name }}</a>
          <span class="text-muted ms-1">({{ tag.count }})</span>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No tags yet.</p>
  {% endif %}
{% endblock %}
